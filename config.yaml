video:
  source: test3.mp4           # 0 = webcam, or path to video file e.g. "test2.mp4"
  fps_override: null  # null = use video fps; set a number to override

runtime:
  display: false      # true = show preview window when running `python main.py`
  debug: true        # true = write debug logs to debug/

output:
  save: true          # false = do not save output video
  path: null          # null = auto-generate output/<source>_<timestamp>.mp4

# Global compute settings — applied to detector and tracker
compute:
  device: "auto" # auto | cuda | cpu | cuda:0 | cuda:1
  half: true       # FP16 inference — faster on GPU, not supported on CPU
  onnx_runtime:
    provider: "tensorrt"    # auto | tensorrt | cuda | cpu
    trt_fp16: true           # use FP16 TensorRT kernels when available
    trt_engine_cache: true   # cache TensorRT engines across runs
    trt_engine_cache_path: "output/trt_cache"
    trt_timing_cache: true   # reuse TensorRT tactic timing across runs

detector:
  model: "checkpoint_best_ema.onnx"  # supports YOLO .pt/.onnx and RF-DETR .pth/.onnx
  confidence: 0.25          # lower threshold: catch partially occluded people
  confidence_new_track: 0.45 # only CREATE a new track if confidence >= this value
  iou: 0.65                 # YOLO NMS IoU; RF-DETR ONNX uses detector.dedup below instead
  classes: [0]              # COCO class 0 = person
  dedup:
    enabled: true           # RF-DETR ONNX: suppress near-identical person boxes before tracking
    iou: 0.68               # high IoU duplicate threshold
    containment: 0.82       # suppress box-inside-box duplicates when centers align
    area_ratio: 0.55        # require roughly similar size for IoU-based duplicate suppression
    center_ratio: 0.24      # max center distance as a fraction of the smaller-box diagonal

# ====================================================================
# TRACKER + RE-ID CONFIGURATION
# ====================================================================
# Supported combinations (change tracker.type + tracker.reid to swap):
#
#   tracker.type   | tracker.reid.type | Description                    | Speed | Accuracy
#   ---------------|-------------------|--------------------------------|-------|----------
#   botsort        | clip              | BoT-SORT + CLIP-ReID (507MB)   | Slow  | Best
#   botsort        | osnet             | BoT-SORT + OSNet (0.8-8.7MB)   | Med   | Good
#   deepsort       | clip              | DeepSORT + CLIP-ReID            | Med   | Good+
#   deepsort       | osnet             | DeepSORT + OSNet                | Fast  | Good
#   strongsort     | clip              | StrongSORT + CLIP-ReID          | Slow  | Best
#   strongsort     | osnet             | StrongSORT + OSNet              | Med   | Good
#   bytetrack      | (none)            | ByteTrack + Histogram gallery   | Fast  | Fair
#
# OSNet model variants (set tracker.reid.model):
#   osnet_x0_25       — 0.2M params,  0.8MB  (fastest, lowest accuracy)
#   osnet_x0_5        — 0.63M params, 2.5MB
#   osnet_x0_75       — 1.29M params, 5.1MB
#   osnet_x1_0        — 2.17M params, 8.7MB  (default)
#   osnet_ain_x1_0    — 2.17M params, 8.7MB  (attention-based, slightly better)
#
# Recommended presets:
#   [Max accuracy]  type=botsort,  reid.type=clip
#   [Balanced]      type=deepsort, reid.type=osnet, reid.model=osnet_x1_0
#   [Fast+light]    type=deepsort, reid.type=osnet, reid.model=osnet_x0_25
#   [Fastest]       type=bytetrack (no model Re-ID)
# ====================================================================

tracker:
  type: "nwojke"         # nwojke | botsort | strongsort | deepsort | bytetrack
  max_display_age: 1     # frames: 0=only matched-this-frame, 1=tolerate 1 miss (eliminates ghost drift)

  # --- Re-ID model ---
  reid:
    type: "osnet"                       # clip | osnet
    # CLIP-ReID settings (used when type=clip)
    weights: "clip_market1501.pt"
    # OSNet settings (used when type=osnet)
    model: "osnet_ain_x1_0"            # osnet_x0_25 | osnet_x0_5 | osnet_x0_75 | osnet_x1_0 | osnet_ain_x1_0
    osnet_weights: null                # null = use PyTorch torchreid backend; set an .onnx file to use ONNX Runtime
    tta: false                          # test-time augmentation (h-flip) — slower but +1-2% accuracy

  # --- BoT-SORT specific params ---
  track_high_thresh: 0.45
  track_low_thresh: 0.1
  new_track_thresh: 0.5
  track_buffer: 120
  match_thresh: 0.8
  proximity_thresh: 0.5
  appearance_thresh: 0.20
  cmc_method: "ecc"
  fuse_first_associate: true
  frame_rate: 30

  # --- DeepSORT / StrongSORT specific params ---
  n_init: 3
  max_iou_distance: 0.7
  max_cosine_distance: 0.3
  nn_budget: 100
  max_age: 30            # nwojke: frames before track is deleted internally (display cutoff = max_display_age)
  ema_alpha: 0.9
  min_conf: 0.25

  # --- Histogram gallery (auto-used with bytetrack) ---
  histogram_gallery:
    enabled: true
    lifetime: 150
    ema_alpha: 0.85
    match_threshold: 0.55
    drift_threshold: 0.70
    use_clahe: true
    spatial_pyramid: true
    n_strips: 3
    v_bins: 32
    v_weight: 0.3

  # --- Model-based gallery (auto-used with botsort/strongsort/deepsort) ---
  gallery:
    enabled: true
    lifetime: 300
    ema_alpha: 0.85
    match_threshold: 0.35
    drift_threshold: 0.6
    merge_area_ratio: 1.5   # bbox area jump ≥ 1.5x → freeze feature (merge detected)

  # --- TrackAnchor — velocity-EMA prediction with adaptive drift ---
  anchor:
    enabled: true
    min_iou: 0.15
    synthetic_conf: 0.40
    min_hits: 3
    max_inject: 10
    velocity_window: 5
    velocity_ema_alpha: 0.4
    stationary_threshold: 0.5
    max_lost_frames: 8      # stop injecting after N consecutive frames with no real detection
    edge_margin_px: 5.0     # bbox within this margin of frame edge → exit, don't inject

  # --- Post-tracker validation ---
  post_validation:
    enabled: true
    max_ar_change: 0.3
    max_area_change: 0.5
    min_track_age: 5
    confidence_penalty: 0.5

  # --- Camera Motion Compensation (off by default) ---
  cmc:
    enabled: false
    pyr_scale: 0.5
    levels: 3
    winsize: 15
    downsample: 2

counting:
  mode: "zone"   # line | zone | both

  crosslines:
    - id: "line_entrance"
      name: "Entrance"
      points: [[626, 118], [41, 110]]
      enter_direction: "positive"
      buffer_px: 20
      confirm_frames: 2

  zones:
    - id: "zone_waiting"
      name: "Waiting Area"
      points: [[96, 101], [628, 103], [619, 258], [89, 256]]
      min_dwell_seconds: 10.0
      refractory_seconds: 0.17

display:
  window_name: "People Counting"
  window_size: [1600, 900]
  show_bbox: true
  show_centers: true
  show_ids: true
  bbox_color: [255, 255, 0]         # cyan box (BGR)
  center_color: [255, 0, 255]       # magenta center
  id_text_color: [255, 255, 255]    # white ID text
  id_bg_color: [24, 24, 24]         # dark ID label background
  line_color: [80, 255, 80]         # vivid green line
  line_label_bg_color: [40, 96, 40] # dark green count label background
  zone_color: [0, 140, 255]         # orange zone
  zone_label_bg_color: [0, 96, 176] # darker orange label background
  count_text_color: [255, 255, 255]
  font_scale: 0.6
  thickness: 2
  bbox_ema_alpha: 0.6
